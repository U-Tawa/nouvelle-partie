<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Nouvelle Partie +</title>
<meta name="description" content="Tu viens de finir un jeu ? Note-le, dis ce que tu en as pensé, et trouve le suivant. Ou cherche un jeu selon ton envie du moment.">
<link rel="preload" href="fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>

<header class="top">
  <div class="top-in">
    <a href="#/" class="logo" aria-label="Nouvelle Partie +, accueil">Nouvelle Partie <b>+</b></a>
    <div class="search" role="search">
      <label for="q" class="sr">Chercher un jeu</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Chercher un jeu" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="q-liste" aria-autocomplete="list">
      <div class="suggest" id="q-liste" role="listbox" aria-label="Jeux trouvés" hidden></div>
    </div>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#/explorer" data-nav="explorer">Explorer</a>
      <a href="#/envie" data-nav="envie">Ce qui me tente</a>
      <a href="#/journal" data-nav="journal">Mon journal <span class="count" id="nb-journal"></span></a>
    </nav>
    <a href="#/connexion" data-nav="connexion" id="lien-compte" class="lien-compte">Se connecter</a>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="pied">
  <div class="pied-in">
    <p>Nouvelle Partie + · prototype</p>
    <p id="credit-donnees">Avis, humeurs et pourcentages : données d'exemple. Durées indicatives. Images des jeux : Steam.</p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lampe-globale" id="lampe-globale" aria-hidden="true"><div class="lg lg-ombre"></div><div class="lg lg-chaud"></div></div>

<script src="js/data.js"></script>
<script src="data/catalogue.js"></script>
<script src="data/bibliotheque.js"></script>
<script src="data/abonnements.js"></script>
<script src="data/textes/index.js"></script>
<script src="js/app.js"></script>
</body>
</html>
